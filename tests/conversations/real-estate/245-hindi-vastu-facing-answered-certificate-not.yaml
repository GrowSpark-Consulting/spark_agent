name: Hindi vastu question is half answered from the knowledge base and the rest is left to the team
description: "A mother wants east-facing and vastu-approved flats. The knowledge base says which facings exist but nothing about vastu approval. A good agent gives the facings and says the team will confirm the vastu part, in Devanagari Hindi. A bad agent says 'fully vastu compliant' because the facing is east."
needsNativeCheck: true
kb:
  - "Shanti Kunj Residency, Greater Noida West: flats face east or north."
  - "2BHK of 1050 sq ft starts at ₹58 lakh."
turns:
  - customer: "माताजी को पूर्व मुखी फ्लैट चाहिए, वास्तु के हिसाब से ठीक होना चाहिए। मिलेगा?"
    mock:
      extraction: { language: hi, intent: question, fields: {}, question: "Are there east facing flats that are vastu approved?" }
      reply: "जी, हमारे फ्लैट पूर्व या उत्तर मुखी हैं। वास्तु के बारे में मेरे पास पक्की जानकारी नहीं है, यह मैं टीम से कन्फ़र्म करवा दूँगा।"
    expect:
      extracted: { language: hi }
      reply: { sent: true, matches: ["[\\u0900-\\u097F]{3}", "पूर्व|उत्तर", "टीम|कन्फ़र्म|कन्फर्म"], notContains: ["पूरी तरह वास्तु"] }
      noInventedPrice: true
      aiReplies: 1
      handoff: null
    mockOnly:
      case: answered_from_kb
