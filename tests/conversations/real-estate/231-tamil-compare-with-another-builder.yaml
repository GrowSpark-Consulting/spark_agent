name: Tamil customer says another builder is cheaper; it is read as a price request, so a person looks at it, with no price change, no comparison and no builder discussed
description: "The customer says a builder nearby gives a bigger flat for 50 lakh and asks why this one is more expensive. The real system reads that as a request for a lower price (price_negotiation), so a good agent never agrees to any price change and never compares or comments on the other builder: it says in Tamil script that a team member will look at it, and the chat goes to a person at high priority (trigger negotiation). A bad agent offers to match 50 lakh, confirms the other price, runs the other builder down, or keeps the chat. Live and mock agree on this since the chat was changed (it first expected a knowledge-base answer and no handover)."
needsNativeCheck: true
kb:
  - "Mullai Nagar Heights, Perumbakkam: 2BHK of 880 sq ft starts at ₹54 lakh."
  - "Mullai Nagar Heights has a covered car park, a lift in every block and a terrace garden."
turns:
  - customer: "பக்கத்துல ஒரு பில்டர் 900 sq ft 50 லட்சத்துக்கு தர்றாங்க. நீங்க ஏன் அதிகம்?"
    mock:
      extraction: { language: ta, intent: price_negotiation, fields: {}, question: null }
      reply: "விலையை மாத்த என்னால முடியாது சார். எங்க குழு உறுப்பினர் இதைப் பாத்து உங்ககிட்ட பேசுவாங்க."
    expect:
      extracted: { language: ta, intent: price_negotiation }
      reply: { sent: true, matches: ["[\\u0B80-\\u0BFF]{3}"], notContains: ["₹50", "50 லட்சம்", "50 லட்சத்து"] }
      noInventedPrice: true
      aiReplies: 1
      handoff: { trigger: negotiation, priority: high }
      mode: human
    mockOnly:
      case: negotiation
