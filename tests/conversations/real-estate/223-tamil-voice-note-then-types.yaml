name: Tamil customer sends a voice note, is asked once in Tamil to type, and a second voice note is not answered again
description: "An auto driver sends two voice notes and then types. A good agent sends one Tamil line asking him to type, tells staff once, says nothing to the second voice note, and answers the typed question. A bad agent answers every voice note or pretends it understood them."
needsNativeCheck: true
contact: { language: ta }
kb:
  - "Mullai Nagar Heights, Perumbakkam: 2BHK of 880 sq ft starts at ₹54 lakh."
turns:
  - customer: "[voice note]"
    voice: true
    expect:
      aiReplies: 1
      handoff: null
      mode: ai
      voiceNoteAlert: true
      reply: { sent: true, matches: ["[\\u0B80-\\u0BFF]{3}"] }
    mockOnly:
      case: voice_note
      reply: { fixed: { key: voice_note, language: ta } }
  - customer: "[another voice note]"
    voice: true
    expect:
      aiReplies: 0
      mode: ai
      voiceNoteAlert: false
    mockOnly:
      case: voice_note_repeat
  - customer: "சவாரில இருக்கேன் அண்ணா. 2BHK விலை சொல்லுங்க"
    mock:
      extraction: { language: ta, intent: question, fields: { config: 2BHK }, question: "What is the price of a 2BHK?" }
      reply: "பரவால்ல அண்ணா. 2BHK ₹54 லட்சத்துல ஆரம்பிக்குது."
    expect:
      reply: { sent: true, matches: ["[\\u0B80-\\u0BFF]{3}", "54"] }
      noInventedPrice: true
      aiReplies: 1
      voiceNoteAlert: false
    mockOnly:
      case: answered_from_kb
