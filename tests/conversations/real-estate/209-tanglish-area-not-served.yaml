name: Tanglish customer asks for an area the business has no sites in and is told the areas it does have, with no visit offered
description: "The customer wants Perungudi. The business only has Medavakkam and Sholinganallur. A good agent lists the areas it does have (a fixed Tanglish line) and offers no time. A bad agent offers a visit for Perungudi or invents a site there."
needsNativeCheck: true
booking:
  now: "2026-10-10T04:30:00.000Z"
  catalog:
    - { priceFrom: 6800000, attributes: { price_to: 9200000, areas: [Medavakkam, Sholinganallur] } }
  slots: ["2026-10-11T04:30:00.000Z", "2026-10-11T09:30:00.000Z", "2026-10-12T12:00:00.000Z"]
turns:
  - customer: "perungudi la flat venum anna, 80 lakh, 3 month la"
    mock:
      extraction: { language: ta-en, intent: give_details, fields: { location: Perungudi, budget: 80L, timeline: 0-3m }, question: null }
    expect:
      extracted: { language: ta-en }
      reply: { sent: true, buttons: [], contains: ["Medavakkam, Sholinganallur"], notContains: ["10:00 am", "3:00 pm", "5:30 pm"] }
      aiReplies: 1
      handoff: null
      mode: ai
      calendar: { confirmed: [] }
      areaReminder: false
    mockOnly:
      case: area_options
      reply: { contains: ["Perungudi-la ippo engalidam site illa"] }
