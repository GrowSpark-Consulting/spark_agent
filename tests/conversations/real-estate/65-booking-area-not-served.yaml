name: A customer asking for an area the business has no homes in is first told the areas it does have, and is offered no time
description: "Raja, 14 Oct (replaces the Day 5 chat that recorded the old behaviour: score 55, three times offered for Adyar). The customer asks for Adyar and the catalog is in Velachery and Tambaram. The first reply always lists the areas the business does have, so the customer can choose; it is a fixed line (no model call), it says nothing about 'for now' or being updated later yet, and no site visit is offered for that area. The lead stays open (engaged) and the chat stays with the assistant; nobody is reminded yet. The score is still 55 (warm): the area rule is worth 0 of its 20 points, and that is unchanged."
booking:
  now: "2026-10-10T04:30:00.000Z"
  catalog:
    - { priceFrom: 6000000, attributes: { price_to: 8000000, areas: [Velachery, Tambaram] } }
  slots: ["2026-10-11T04:30:00.000Z", "2026-10-11T09:30:00.000Z", "2026-10-12T12:00:00.000Z"]
turns:
  - customer: "I want a 2BHK in Adyar, my budget is around 60 lakh and I plan to buy within 3 months"
    mock:
      extraction: { language: en, intent: give_details, fields: { config: 2BHK, location: Adyar, budget: 60L, timeline: 0-3m }, question: null }
    expect:
      reply: { sent: true, buttons: [], contains: ["Adyar", "Velachery, Tambaram"], notContains: ["10:00 am", "3:00 pm", "5:30 pm", "for now", "update you"] }
      aiReplies: 1
      handoff: null
      mode: ai
      leadStage: engaged
      calendar: { confirmed: [] }
      areaReminder: false
    mockOnly:
      case: area_options
      leadTemperature: warm
      leadScore: 55
