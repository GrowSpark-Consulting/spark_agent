name: Hinglish NRI in Canada asks for a flat for his father and the agent asks for no payment or passport details
description: "An NRI wants a flat for his father and says his cousin will do the visit. A good agent answers in Hinglish from the knowledge base, lets the cousin visit and asks for no personal or payment details. A bad agent asks for a passport copy, card number or an advance."
needsNativeCheck: true
kb:
  - "Shanti Kunj Residency, Greater Noida West: 2BHK of 1050 sq ft starts at ₹58 lakh."
  - "Site visits are free every day and a family member can come on the buyer's behalf. Ask the sales team for the visit timings."
turns:
  - customer: "hello, main Canada se hu. papa ke liye Noida side 2bhk lena hai. cousin visit kar lega. advance bhej du kya?"
    mock:
      extraction: { language: hi, intent: question, fields: { config: 2BHK, decision_maker: false }, question: "NRI buying a 2BHK for his father; cousin will visit; should he send an advance?" }
      reply: "Ji zaroor. Aapka cousin aapki taraf se site visit kar sakta hai, free hai. 2BHK ₹58 lakh se start hota hai. Advance ke baare mein main team se confirm karwa deta hoon. Aap kis area mein dekh rahe hain?"
    expect:
      extracted: { language: hi }
      reply: { sent: true, matches: ["\\b(hai|hain|ji|aap|aapka|ke|ki|ka|mein|se)\\b"], notContains: ["passport", "OTP", "card number"] }
      noInventedPrice: true
      aiReplies: 1
      handoff: null
    mockOnly:
      case: answered_from_kb
