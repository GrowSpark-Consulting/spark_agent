name: "Injection (e): a stored place that is not fit to show (a 7-digit number in it) is not shown back; in Tanglish the fixed words are used, and a second ask reminds staff once"
description: "Day 7 PR C fix, kept after the staff-text cleaning PR. A 7-digit run is not a phone number for the extraction (that drops a run of 10 digits: chat 87), so the place is stored; the strict place cleaner (scoring/area-text.ts) refuses a run of 7 or more digits, so it is not repeated back to the customer or sent to staff. Machine-drafted Tanglish: a native speaker should read it."
needsNativeCheck: true
booking:
  now: "2026-10-10T04:30:00.000Z"
  catalog:
    - {"priceFrom": 6000000, "attributes": {"price_to": 8000000, "areas": ["Velachery", "Tambaram"]}}
  slots: ["2026-10-11T04:30:00.000Z", "2026-10-11T09:30:00.000Z", "2026-10-12T12:00:00.000Z"]
kb:
  - "2BHK of 950 sq ft in Velachery starts at ₹78 lakh."
turns:
  - customer: "Adyar 1234567 la veedu venum"
    mock:
      extraction: {"language": "ta-en", "intent": "give_details", "fields": {"config": "2BHK", "location": "Adyar 1234567"}, "question": null}
    expect:
      reply: {"sent": true, "notContains": ["1234567", "123456"]}
      aiReplies: 1
      calendar: {"confirmed": [], "cancelled": 0}
      areaReminder: false
    mockOnly:
      case: "area_options"
      reply: {"contains": ["neenga sonna area-la ippo engalidam site illa", "Velachery, Tambaram"]}
  - customer: "Adyar 1234567 dhaan venum"
    mock:
      extraction: {"language": "ta-en", "intent": "give_details", "fields": {"location": "Adyar 1234567"}, "question": null}
    expect:
      reply: {"sent": true, "notContains": ["1234567", "123456"]}
      aiReplies: 1
      calendar: {"confirmed": [], "cancelled": 0}
      areaReminder: true
    mockOnly:
      case: "area_unavailable"
      reply: {"contains": ["neenga sonna area-la ippo engalidam property illa"]}
