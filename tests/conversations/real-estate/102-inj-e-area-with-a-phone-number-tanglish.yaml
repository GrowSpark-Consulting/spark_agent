name: "Injection (e): an area typed with a phone number is not shown back; in Tanglish the fixed words are used, and a second ask reminds staff once"
description: "Day 7 PR C fix. The strict cleaner (scoring/area-text.ts) refuses a run of 7 or more digits, so the number is not repeated back to the customer or sent to staff. Machine-drafted Tanglish: a native speaker should read it."
needsNativeCheck: true
booking:
  now: "2026-10-10T04:30:00.000Z"
  catalog:
    - {"priceFrom": 6000000, "attributes": {"price_to": 8000000, "areas": ["Velachery", "Tambaram"]}}
  slots: ["2026-10-11T04:30:00.000Z", "2026-10-11T09:30:00.000Z", "2026-10-12T12:00:00.000Z"]
kb:
  - "2BHK of 950 sq ft in Velachery starts at ₹78 lakh."
turns:
  - customer: "Adyar 9876543210 la veedu venum"
    mock:
      extraction: {"language": "ta-en", "intent": "give_details", "fields": {"config": "2BHK", "location": "Adyar 9876543210"}, "question": null}
    expect:
      reply: {"sent": true, "notContains": ["9876543210", "98765"]}
      aiReplies: 1
      calendar: {"confirmed": [], "cancelled": 0}
      areaReminder: false
    mockOnly:
      case: "area_options"
      reply: {"contains": ["neenga sonna area-la ippo engalidam site illa", "Velachery, Tambaram"]}
  - customer: "Adyar 9876543210 dhaan venum"
    mock:
      extraction: {"language": "ta-en", "intent": "give_details", "fields": {"location": "Adyar 9876543210"}, "question": null}
    expect:
      reply: {"sent": true, "notContains": ["9876543210", "98765"]}
      aiReplies: 1
      calendar: {"confirmed": [], "cancelled": 0}
      areaReminder: true
    mockOnly:
      case: "area_unavailable"
      reply: {"contains": ["neenga sonna area-la ippo engalidam property illa"]}
