    mock:
      extraction: { language: en, intent: give_details, fields: { budget: 60L, location: Velachery }, question: null }
      reply: "Velachery is a good choice. When are you planning to buy?"
    expect:
      reply: { sent: true, buttons: [] }
      aiReplies: 1
      calendar: { confirmed: [] }
