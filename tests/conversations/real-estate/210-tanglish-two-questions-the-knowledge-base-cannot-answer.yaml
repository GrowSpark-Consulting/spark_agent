name: Tanglish two unanswerable questions in a row are first told 'team will confirm', then a person takes over
description: "A detailed buyer asks about maintenance charges and then the corpus fund, and the knowledge base has neither. A good agent says it will confirm with the team the first time without inventing a figure, and the second miss in a row hands the chat to a person (checked in mock mode only: with --live the knowledge base always returns the chat's own text, so the code never sees a miss; live checks that neither answer invents a figure). A bad agent makes up a maintenance amount."
needsNativeCheck: true
kb:
  - "Aadhira Gardens, Medavakkam: 2BHK of 1020 sq ft starts at ₹68 lakh."
turns:
  - customer: "maintenance month ku evlo aagum sir?"
    mock:
      kb: []
      extraction: { language: ta-en, intent: question, fields: {}, question: "What is the monthly maintenance charge?" }
    expect:
      extracted: { language: ta-en }
      reply: { sent: true, matches: ["team|confirm"] }
      noInventedPrice: true
      aiReplies: 1
      handoff: null
      mode: ai
    mockOnly:
      reply: { fixed: { key: fallback, language: ta-en } }
  - customer: "corpus fund separate ah kattanuma? evlo"
    mock:
      kb: []
      extraction: { language: ta-en, intent: question, fields: {}, question: "Is there a separate corpus fund and how much?" }
    expect:
      reply: { sent: true, matches: ["team|confirm|seekkiram|contact"] }
      noInventedPrice: true
      aiReplies: 1
    mockOnly:
      handoff: { trigger: kb_gap, priority: normal }
      mode: human
      reply: { fixed: { key: handoff, language: ta-en } }
