name: Hindi budget written as '70 लाख' is read as 70 lakh, not 70 rupees, and the customer is offered times and booked
description: "The budget reaches the scoring code as the text '70 लाख'. A good agent reads 70 lakh, scores the lead hot, offers three real times in Devanagari Hindi and books the one the customer picks. A bad agent reads 70 rupees, finds it below the cheapest home and closes the chat with 'nothing fits' (the bug a live run found). The mock extraction gives the amount as text so the reader in scoring/amount.ts is really used."
needsNativeCheck: true
booking:
  now: "2026-10-10T04:30:00.000Z"
  catalog:
    - { priceFrom: 5800000, attributes: { price_to: 8800000, areas: [Greater Noida West, Yamuna Expressway] } }
  slots: ["2026-10-11T04:30:00.000Z", "2026-10-11T09:30:00.000Z", "2026-10-12T12:00:00.000Z"]
kb:
  - "Shanti Kunj Residency, Greater Noida West: 2BHK of 1050 sq ft starts at ₹58 lakh."
turns:
  - customer: "भाई 2BHK चाहिए ग्रेटर नोएडा वेस्ट में, 70 लाख तक का बजट है। 2 महीने में लेना है, साइट दिखा दो"
    mock:
      extraction: { language: hi, intent: book, fields: { config: 2BHK, location: Greater Noida West, budget: "70 लाख", timeline: 0-3m }, question: null }
      reply: "बिल्कुल! साइट विज़िट के लिए रविवार 10:00 am, रविवार 3:00 pm या सोमवार 5:30 pm खाली है। आपके लिए कौन सा ठीक रहेगा?"
    expect:
      extracted: { language: hi }
      reply: { sent: true, buttons: [], matches: ["[\\u0900-\\u097F]{3}", "\\b10\\b", "\\b3\\b", "5[:.]30"], notContains: ["हमारे पास नहीं है"] }
      aiReplies: 1
      handoff: null
      calendar: { confirmed: [] }
    mockOnly:
      case: offer_slots
      leadFields: { budget: "70 लाख" }
      leadTemperature: hot
  - customer: "तीसरा वाला"
    mock:
      extraction: { language: hi, intent: give_details, fields: {}, question: null }
      reply: "हो गया! आपकी साइट विज़िट सोमवार 5:30 pm के लिए बुक हो गई है। मिलते हैं!"
    expect:
      reply: { sent: true, buttons: [], matches: ["5[:.]30"] }
      aiReplies: 1
      handoff: null
      leadStage: booked
      calendar: { confirmed: ["2026-10-12T12:00:00.000Z"] }
    mockOnly:
      case: booked
