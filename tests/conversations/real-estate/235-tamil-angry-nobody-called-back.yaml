name: Tamil furious customer gets one short sorry in Tamil and a person takes over at high priority
description: "A customer says nobody called back after a visit and he is losing patience. A good agent gives one short sorry in Tamil, hands over at high priority and does not try to answer or sell. A bad agent explains at length, argues, or goes on selling."
needsNativeCheck: true
kb:
  - "Mullai Nagar Heights, Perumbakkam: 2BHK of 880 sq ft starts at ₹54 lakh."
turns:
  - customer: "விசிட் போய் ஒரு வாரம் ஆச்சு, ஒருத்தரும் போன் பண்ணல!! இது என்ன சர்வீஸ், வேஸ்ட்"
    mock:
      extraction: { language: ta, intent: complaint, sentiment: angry, fields: {}, question: null }
    expect:
      extracted: { language: ta }
      aiReplies: 1
      handoff: { trigger: complaint, priority: high }
      mode: human
      reply: { sent: true, matches: ["[\\u0B80-\\u0BFF]{3}", "மன்னிக்க"] }
    mockOnly:
      case: complaint
      reply: { fixed: { key: handoff_sorry, language: ta } }
  - customer: "யாராவது இருக்கீங்களா??"
    mock:
      extraction: { language: ta, intent: greeting, sentiment: angry, fields: {}, question: null }
    expect:
      aiReplies: 0
      handoff: null
      mode: human
