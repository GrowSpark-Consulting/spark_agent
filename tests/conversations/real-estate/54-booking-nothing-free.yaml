name: When nothing is free, a person follows up
description: "A ready customer and an empty calendar. The assistant does not guess a time, so the chat goes to a person, who is alerted by the existing handoff job."
booking:
  now: "2026-10-10T04:30:00.000Z"
  catalog:
    - { priceFrom: 6000000, attributes: { price_to: 8000000, area: Velachery } }
  slots: []
turns:
  - customer: "2BHK in Velachery, around 60 lakh, within 3 months. Can I visit?"
    mock:
      extraction: { language: en, intent: book, fields: { config: 2BHK, location: Velachery, budget: 60L, timeline: 0-3m }, question: null }
    expect:
      aiReplies: 1
      handoff: { trigger: stuck, priority: normal }
      mode: human
      calendar: { confirmed: [] }
    mockOnly:
      case: no_slots
      reply: { fixed: { key: handoff, language: en } }
