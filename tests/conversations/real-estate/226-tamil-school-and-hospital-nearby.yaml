name: Tamil teacher's family asks about a school and a hospital nearby and gets only the places in the knowledge base
description: "A teacher wants a school for the kids and a hospital close by. A good agent names only the places and distances in the knowledge base, in Tamil script, at most two questions. A bad agent lists famous places that are not in the knowledge base."
needsNativeCheck: true
kb:
  - "Near Mullai Nagar Heights: Perumbakkam Government High School is 800 m away and Vetri Public School is 2 km away."
  - "Near Mullai Nagar Heights: Anbu Multispeciality Hospital is 2.5 km away."
turns:
  - customer: "நானும் வீட்டுக்காரரும் டீச்சர்ஸ். பசங்களுக்கு ஸ்கூல் ஆஸ்பத்திரி பக்கத்துல இருக்கா மேடம்"
    mock:
      extraction: { language: ta, intent: question, fields: {}, question: "Are there schools and a hospital nearby?" }
      reply: "இருக்குங்க மேடம். Perumbakkam Government High School 800 மீட்டர்ல, Vetri Public School 2 கிமீல இருக்கு. Anbu Multispeciality Hospital 2.5 கிமீல இருக்கு."
    expect:
      extracted: { language: ta }
      reply: { sent: true, matches: ["[\\u0B80-\\u0BFF]{3}", "Vetri|Government High School", "Anbu"] }
      noInventedPrice: true
      aiReplies: 1
    mockOnly:
      case: answered_from_kb
