name: Tamil budget written as '65 லட்சம்' is read as 65 lakh, not 65 rupees, and the customer is offered times and booked
description: "The extraction keeps the customer's own words, so the budget reaches the scoring code as the text '65 லட்சம்'. A good agent reads that as 65 lakh, scores the lead hot, offers three real times and books the one the customer picks. A bad agent reads it as 65 rupees, finds it below the cheapest home, and closes the chat with 'nothing fits' on the first message (the bug a live run found). The mock extraction gives the amount as text, not as a ready number, so this chat really uses the reader in scoring/amount.ts."
needsNativeCheck: true
booking:
  now: "2026-10-10T04:30:00.000Z"
  catalog:
    - { priceFrom: 5400000, attributes: { price_to: 7400000, areas: [Perumbakkam, Pallikaranai] } }
  slots: ["2026-10-11T04:30:00.000Z", "2026-10-11T09:30:00.000Z", "2026-10-12T12:00:00.000Z"]
kb:
  - "Mullai Nagar Heights, Perumbakkam: 2BHK of 880 sq ft starts at ₹54 lakh."
turns:
  - customer: "வணக்கம் சார், பெரும்பாக்கத்துல 2BHK வேணும். 65 லட்சம் பட்ஜெட், 2 மாசத்துல வாங்கணும்"
    mock:
      extraction: { language: ta, intent: give_details, fields: { config: 2BHK, location: Perumbakkam, budget: "65 லட்சம்", timeline: 0-3m }, question: null }
      reply: "வணக்கம் சார்! ஞாயிறு 10:00 am, ஞாயிறு 3:00 pm இல்லனா திங்கள் 5:30 pm சைட் விசிட்டுக்கு இருக்கு. எது உங்களுக்கு வசதி?"
    expect:
      extracted: { language: ta }
      reply: { sent: true, buttons: [], matches: ["[\\u0B80-\\u0BFF]{3}", "\\b10\\b", "\\b3\\b", "5[:.]30"], notContains: ["பொருந்தற வீடு எங்ககிட்ட இல்ல"] }
      aiReplies: 1
      handoff: null
      calendar: { confirmed: [] }
    mockOnly:
      case: offer_slots
      leadFields: { budget: "65 லட்சம்" }
      leadTemperature: hot
  - customer: "இரண்டாவது ஓகே"
    mock:
      extraction: { language: ta, intent: give_details, fields: {}, question: null }
      reply: "முடிஞ்சது சார்! ஞாயிறு 3:00 pm-க்கு உங்க சைட் விசிட் புக் ஆயிடுச்சு. சந்திப்போம்!"
    expect:
      reply: { sent: true, buttons: [], matches: ["\\b3\\b"] }
      aiReplies: 1
      handoff: null
      leadStage: booked
      calendar: { confirmed: ["2026-10-11T09:30:00.000Z"] }
    mockOnly:
      case: booked
