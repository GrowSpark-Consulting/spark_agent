name: An angry customer gets one short sorry, and a person takes over
description: "Day 4 (Raja, 11 Oct): not a long reply and not an answer to the question. One apology, the handover line, the chat to a person at high priority, and the business is alerted by the handoff event."
turns:
  - customer: "This is the third time nobody is calling me back!! Useless service"
    mock:
      extraction: { language: en, intent: complaint, sentiment: angry, question: null }
    expect:
      aiReplies: 1
      handoff: { trigger: complaint, priority: high }
      mode: human
      reply: { sent: true, contains: ["sorry"] }
    mockOnly:
      case: complaint
      reply: { fixed: { key: handoff_sorry, language: en } }
  - customer: "Hello?? Is anyone there"
    mock:
      extraction: { language: en, intent: greeting, sentiment: angry, question: null }
    expect:
      aiReplies: 0
      handoff: null
      mode: human
