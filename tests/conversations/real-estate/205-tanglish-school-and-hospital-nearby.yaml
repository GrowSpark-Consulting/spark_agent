name: Tanglish mother asks about schools and a hospital nearby and gets only the places in the knowledge base
description: "A mother of two wants a school and a hospital close by. A good agent names only the places and distances in the knowledge base, in Tanglish, and asks at most two questions. A bad agent adds well-known schools or hospitals that are not in the knowledge base."
needsNativeCheck: true
kb:
  - "Near Aadhira Gardens: Little Lotus School is 1 km away and Greenfield Matriculation School is 2.5 km away."
  - "Near Aadhira Gardens: Lakshmi Care Hospital is 3 km away."
turns:
  - customer: "pasanga rendu perum LKG UKG. school hospital ellam pakathula irukka madam"
    mock:
      extraction: { language: ta-en, intent: question, fields: {}, question: "Are there schools and a hospital nearby?" }
      reply: "Irukku madam. Little Lotus School 1 km la, Greenfield Matriculation School 2.5 km la irukku. Lakshmi Care Hospital 3 km la irukku. Neenga edhavadhu oru BHK paakureengala?"
    expect:
      extracted: { language: ta-en }
      reply: { sent: true, matches: ["Little Lotus|Greenfield", "Lakshmi"] }
      noInventedPrice: true
      aiReplies: 1
    mockOnly:
      case: answered_from_kb
  - customer: "ambulance service um irukka anga? night la emergency na"
    mock:
      kb: []
      extraction: { language: ta-en, intent: question, fields: {}, question: "Is there an ambulance service nearby at night?" }
    expect:
      reply: { sent: true, matches: ["team|confirm"] }
      noInventedPrice: true
      aiReplies: 1
    mockOnly:
      reply: { fixed: { key: fallback, language: ta-en } }
