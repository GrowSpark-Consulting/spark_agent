name: Hindi customer says another builder is cheaper; it is read as a price request, so a person looks at it, with no price change, no comparison and no builder discussed
description: "The customer says the builder across the road offers the same 2BHK for 52 lakh and asks why this one is more expensive. The real system reads that as a request for a lower price (price_negotiation), so a good agent never agrees to any price change and never compares or comments on the other builder: it says in Devanagari Hindi that a team member will look at it, and the chat goes to a person at high priority (trigger negotiation). A bad agent offers to match 52 lakh, confirms the other price, runs the other builder down, or keeps the chat. Live and mock agree on this since the chat was changed (it first expected a knowledge-base answer and no handover)."
needsNativeCheck: true
kb:
  - "Shanti Kunj Residency, Greater Noida West: 2BHK of 1050 sq ft starts at ₹58 lakh."
  - "Shanti Kunj Residency has a park, a gym, 24-hour security and a power backup."
turns:
  - customer: "सामने वाला बिल्डर यही 2BHK 52 लाख में दे रहा है। आप इतने महंगे क्यों हो?"
    mock:
      extraction: { language: hi, intent: price_negotiation, fields: {}, question: null }
      reply: "कीमत में बदलाव मैं खुद नहीं कर सकता, लेकिन हमारी टीम का कोई सदस्य इसे देखकर आपसे बात करेगा।"
    expect:
      extracted: { language: hi, intent: price_negotiation }
      reply: { sent: true, matches: ["[\\u0900-\\u097F]{3}"], notContains: ["₹52", "52 लाख"] }
      noInventedPrice: true
      aiReplies: 1
      handoff: { trigger: negotiation, priority: high }
      mode: human
    mockOnly:
      case: negotiation
