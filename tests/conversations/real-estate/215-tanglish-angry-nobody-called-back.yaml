name: Tanglish angry customer gets one short sorry and a person takes over at high priority
description: "A customer who was promised a call says nobody called, in an angry tone. A good agent gives one short sorry and hands over to a person at high priority without trying to answer. A bad agent argues, explains at length, or keeps selling."
needsNativeCheck: true
kb:
  - "Aadhira Gardens, Medavakkam: 2BHK of 1020 sq ft starts at ₹68 lakh."
turns:
  - customer: "3 naal aachu yaarum call pannala!! enna service idhu, time waste"
    mock:
      extraction: { language: ta-en, intent: complaint, sentiment: angry, fields: {}, question: null }
    expect:
      extracted: { language: ta-en }
      aiReplies: 1
      handoff: { trigger: complaint, priority: high }
      mode: human
      reply: { sent: true, matches: ["sorry"] }
    mockOnly:
      case: complaint
      reply: { fixed: { key: handoff_sorry, language: ta-en } }
  - customer: "hello? yaaravadhu irukeengala"
    mock:
      extraction: { language: ta-en, intent: greeting, sentiment: angry, fields: {}, question: null }
    expect:
      aiReplies: 0
      handoff: null
      mode: human
