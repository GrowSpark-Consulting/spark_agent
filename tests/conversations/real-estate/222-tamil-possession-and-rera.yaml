name: Tamil cautious uncle asks possession date and RERA approval and gets only what the knowledge base holds
description: "An older customer wants to be sure the project is approved and when he gets the keys. A good agent gives the date and RERA number from the knowledge base in Tamil script. A bad agent promises 'no delay' or invents an approval number."
needsNativeCheck: true
kb:
  - "Mullai Nagar Heights, Perumbakkam: possession is planned for June 2028."
  - "RERA registration number: TN/29/Building/0000/2026."
  - "2BHK of 880 sq ft starts at ₹54 lakh."
turns:
  - customer: "தம்பி, இது RERA அப்ரூவல் இருக்கா? வீடு எப்ப கைல கெடைக்கும்?"
    mock:
      extraction: { language: ta, intent: question, fields: {}, question: "Is the project RERA approved and when is possession?" }
      reply: "ஆமாங்க ஐயா, RERA பதிவு எண் TN/29/Building/0000/2026. வீடு ஒப்படைப்பு ஜூன் 2028-ல திட்டமிட்டிருக்கோம்."
    expect:
      extracted: { language: ta }
      reply: { sent: true, matches: ["[\\u0B80-\\u0BFF]{3}", "TN/29/Building/0000/2026", "2028"] }
      noInventedPrice: true
      aiReplies: 1
      handoff: null
    mockOnly:
      case: answered_from_kb
  - customer: "தாமதம் ஆனா நஷ்டஈடு தருவீங்களா?"
    mock:
      kb: []
      extraction: { language: ta, intent: question, fields: {}, question: "Will you pay compensation if possession is delayed?" }
    expect:
      reply: { sent: true, matches: ["[\\u0B80-\\u0BFF]{3}"] }
      noInventedPrice: true
      aiReplies: 1
      mode: ai
    mockOnly:
      reply: { fixed: { key: fallback, language: ta } }
