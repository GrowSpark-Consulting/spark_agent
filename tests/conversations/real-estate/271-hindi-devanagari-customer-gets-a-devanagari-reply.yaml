name: Hindi — a customer who writes in Devanagari gets a reply in Devanagari
description: "The reply follows the script of the customer's latest message (reply prompt v3, rule 5). A good agent answers a Devanagari question in Devanagari, with the price and size that are in the knowledge base and nothing else. A bad agent answers in English letters (Hinglish) or in English because it was only told 'Hindi' and guessed the script. Live: the check is that the reply has Devanagari letters and the price from the knowledge base only."
needsNativeCheck: true
kb:
  - "Shanti Kunj Residency, Greater Noida West: 2BHK of 1050 sq ft starts at ₹58 lakh and 3BHK of 1450 sq ft starts at ₹82 lakh."
  - "Site visits are free every day. Ask the sales team for the visit timings."
turns:
  - customer: "ग्रेटर नोएडा वेस्ट में 2BHK का रेट क्या है? कितने sq ft का है?"
    mock:
      extraction: { language: hi, intent: question, fields: { location: Greater Noida West, config: 2BHK }, question: "What is the price and size of a 2BHK in Greater Noida West?" }
      reply: "ग्रेटर नोएडा वेस्ट में 2BHK 1050 sq ft का है और इसकी शुरुआत ₹58 लाख से होती है। क्या आप साइट विज़िट करना चाहेंगे?"
    expect:
      extracted: { language: hi, intent: question }
      reply: { sent: true, matches: ["[\\u0900-\\u097F]{3}", "58"], notContains: ["team kitta soll"] }
      noInventedPrice: true
      aiReplies: 1
    mockOnly:
      case: answered_from_kb
      reply: { contains: ["₹58 लाख"] }
  - customer: "3BHK का क्या रेट है?"
    mock:
      extraction: { language: hi, intent: question, fields: { config: 3BHK }, question: "What is the price of a 3BHK?" }
      reply: "3BHK 1450 sq ft की शुरुआत ₹82 लाख से होती है।"
    expect:
      reply: { sent: true, matches: ["[\\u0900-\\u097F]{3}", "82"] }
      noInventedPrice: true
      aiReplies: 1
    mockOnly:
      case: answered_from_kb
