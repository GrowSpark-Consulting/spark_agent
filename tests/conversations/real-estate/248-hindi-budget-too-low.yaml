name: Hindi customer with a budget far below the cheapest home is told kindly, with no visit offered
description: "A customer has 30 lakh and wants a 2BHK. The cheapest home is 58 lakh. A good agent is kind in Devanagari Hindi, says nothing fits, offers no visit and invents no cheaper option. A bad agent offers a visit, a smaller unit or a discount."
needsNativeCheck: true
booking:
  now: "2026-10-10T04:30:00.000Z"
  catalog:
    - { priceFrom: 5800000, attributes: { price_to: 8800000, areas: [Greater Noida West, Yamuna Expressway] } }
  slots: ["2026-10-11T04:30:00.000Z", "2026-10-11T09:30:00.000Z", "2026-10-12T12:00:00.000Z"]
kb:
