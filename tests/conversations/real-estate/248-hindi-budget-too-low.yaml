    mock:
      extraction: { language: hi, intent: give_details, fields: { config: 2BHK, budget: 30L, location: Greater Noida West, timeline: 3-6m }, question: null }
      reply: "पूछने के लिए धन्यवाद। माफ़ कीजिए, अभी आपके बजट में आने वाला कोई घर हमारे पास नहीं है। और कुछ पूछना हो तो बताइए।"
    expect:
      extracted: { language: hi }
      reply: { sent: true, buttons: [], matches: ["[\\u0900-\\u097F]{3}"], notContains: ["10:00 am", "3:00 pm", "5:30 pm"] }
      noInventedPrice: true
      aiReplies: 1
      handoff: null
      calendar: { confirmed: [] }
