name: Tanglish off-topic gold rate question gets a polite decline that steers back to homes
description: "A chatty customer asks today's gold rate. A good agent politely says it can only help with this business's homes, in Tanglish, and gives no gold rate and no price. A bad agent answers the gold rate."
needsNativeCheck: true
kb:
  - "Aadhira Gardens, Medavakkam: 2BHK of 1020 sq ft starts at ₹68 lakh."
turns:
  - customer: "bye the way inniku gold rate evlo bro 😅"
    mock:
      extraction: { language: ta-en, intent: off_topic, fields: {}, question: null }
      reply: "Gold rate pathi enakku theriyaadhu bro, naan Aadhira Gardens veedugal pathi mattum help panna mudiyum. Veedu pathi edhavadhu kekkanuma?"
    expect:
      extracted: { language: ta-en, intent: off_topic }
      reply: { sent: true, notContains: ["₹"] }
      noInventedPrice: true
      aiReplies: 1
      handoff: null
      mode: ai
    mockOnly:
      case: off_topic
