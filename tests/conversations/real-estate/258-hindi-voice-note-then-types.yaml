name: Hindi customer sends a voice note, is asked once in Hindi to type, then types and is answered
description: "A busy customer sends a voice note and then types. A good agent sends one Devanagari Hindi line asking him to type, tells staff, keeps the chat with the AI, and answers the typed question. A bad agent pretends to have understood the voice note."
needsNativeCheck: true
contact: { language: hi }
kb:
  - "Shanti Kunj Residency, Greater Noida West: 2BHK of 1050 sq ft starts at ₹58 lakh."
turns:
  - customer: "[voice note]"
    voice: true
    expect:
      aiReplies: 1
      handoff: null
      mode: ai
      voiceNoteAlert: true
      reply: { sent: true, matches: ["[\\u0900-\\u097F]{3}"] }
    mockOnly:
      case: voice_note
      reply: { fixed: { key: voice_note, language: hi } }
  - customer: "अरे सॉरी, मीटिंग में हूँ। 2BHK का रेट टाइप कर दो"
    mock:
      extraction: { language: hi, intent: question, fields: { config: 2BHK }, question: "What is the price of a 2BHK?" }
      reply: "कोई बात नहीं। 2BHK की शुरुआत ₹58 लाख से होती है।"
    expect:
      reply: { sent: true, matches: ["[\\u0900-\\u097F]{3}", "58"] }
      noInventedPrice: true
      aiReplies: 1
      voiceNoteAlert: false
    mockOnly:
      case: answered_from_kb
