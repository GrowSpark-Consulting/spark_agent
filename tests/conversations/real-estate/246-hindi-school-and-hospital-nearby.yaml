    mock:
      extraction: { language: hi, intent: question, fields: {}, question: "Are there schools and a hospital nearby?" }
      reply: "जी, पास में Gyan Bharti Public School 1.2 km पर और Little Scholars School 3 km पर है। Sanjeevani Hospital 2 km पर है। आप कौन से बजट में देख रहे हैं?"
    expect:
      extracted: { language: hi }
      reply: { sent: true, matches: ["[\\u0900-\\u097F]{3}", "Gyan Bharti|Little Scholars", "Sanjeevani"] }
      noInventedPrice: true
      aiReplies: 1
    mockOnly:
      case: answered_from_kb
