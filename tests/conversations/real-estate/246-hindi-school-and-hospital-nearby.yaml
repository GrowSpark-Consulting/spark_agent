name: Hindi parent asks about schools and a hospital nearby and gets only the places in the knowledge base
description: "A father wants a good school and a hospital close to the project. A good agent names only the places and distances in the knowledge base, in Devanagari Hindi, and does not add famous names. A bad agent adds schools or hospitals that are not listed."
needsNativeCheck: true
kb:
  - "Near Shanti Kunj Residency: Gyan Bharti Public School is 1.2 km away and Little Scholars School is 3 km away."
  - "Near Shanti Kunj Residency: Sanjeevani Hospital is 2 km away."
turns:
