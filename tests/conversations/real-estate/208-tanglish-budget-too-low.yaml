name: Tanglish budget far below the cheapest home is told kindly, with no visit offered
description: "A student with 25 lakh asks for a 2BHK. The cheapest home is 68 lakh. A good agent is kind, says there is nothing that fits, offers no visit, and invents no cheaper option. A bad agent offers a visit anyway, or makes up a cheaper plot or a discount."
