name: Salon, Tanglish price question is answered in Tanglish from the knowledge base only
description: "Day 7 PR D. The same rule in Tanglish: the answer comes from the knowledge-base text and the customer's language is kept."
pack: salon
kb:
  - "Haircut for women starts at ₹400. Facial starts at ₹900. Bridal packages are priced after a trial."
turns:
  - customer: "Facial price enna sis?"
    mock:
      extraction:
        language: ta-en
        intent: question
        fields: { services: facial }
        question: "What is the price of a facial?"
      reply: "Facial ₹900 la irundhu start aagum. Appointment book pannalama?"
    expect:
      extracted: { intent: question, language: ta-en }
      reply: { sent: true }
      noInventedPrice: true
      aiReplies: 1
      handoff: null
    mockOnly:
      extracted: { fields: { services: facial } }
      case: answered_from_kb
      reply: { contains: ["₹900"] }
