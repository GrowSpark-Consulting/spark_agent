name: Salon, an angry customer gets one short sorry, and a person takes over
description: "Day 7 PR D. The complaint trigger is in the salon pack's handoff list; one apology, the handover line, the chat to a person at high priority, and the assistant stays quiet afterwards."
pack: salon
turns:
  - customer: "My hair colour came out wrong yesterday and nobody is picking up my calls!! Useless"
    mock:
      extraction: { language: en, intent: complaint, sentiment: angry, question: null }
    expect:
      aiReplies: 1
      handoff: { trigger: complaint, priority: high }
      mode: human
      reply: { sent: true, contains: ["sorry"] }
    mockOnly:
      case: complaint
      reply: { fixed: { key: handoff_sorry, language: en } }
  - customer: "Hello?? Is anyone there"
    mock:
      extraction: { language: en, intent: greeting, sentiment: angry, question: null }
    expect:
      aiReplies: 0
      handoff: null
      mode: human
