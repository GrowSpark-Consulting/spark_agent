name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job names are the required status checks in branch protection; rename both together.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Supabase's local ports (54320-54329) sit inside Linux's ephemeral range (32768-60999). An
      # outgoing connection during the image pull can take one, and `db start` then fails with
      # "address already in use" on 54322. Move the ephemeral range above them.
      - run: |
          echo "ephemeral range before: $(cat /proc/sys/net/ipv4/ip_local_port_range)"
          sudo sysctl -w net.ipv4.ip_local_port_range="60000 65000"
      # Starts Postgres and applies every file in supabase/migrations from scratch.
      - run: pnpm exec supabase db start
      - run: pnpm exec supabase db lint --level error
      # Rebuild from scratch with the seed (supabase/seed/*), as a new machine would.
      - run: pnpm exec supabase db reset
      # pgTAP tests in supabase/tests: tenant isolation, RLS on every table, seed contents.
      - run: pnpm exec supabase test db
      # 50 parallel spend_credits calls on separate connections must never overdraw.
      - run: bash scripts/db/spend-credits-concurrency.sh
      # 20 parallel holds on one slot: exactly one wins; callbacks with no person never clash.
      - run: bash scripts/db/hold-slot-concurrency.sh
      # 10 parallel members and 10 parallel numbers: never past the plan's seats (2) or numbers (1).
      - run: bash scripts/db/plan-limit-concurrency.sh
